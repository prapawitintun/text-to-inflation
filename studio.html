<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Air / Script · Pattern and Structure Studio</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f5f4ee;color:#193e3d;font:14px system-ui,sans-serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #d5ddd5}strong{font-size:12px;letter-spacing:1px}nav{display:flex;gap:7px;flex-wrap:wrap}button{padding:9px 12px;font:inherit;color:#193e3d;border:1px solid #aebeb3;border-radius:6px;background:transparent;cursor:pointer}button[aria-selected=true]{color:white;background:#193e3d}button:focus-visible{outline:3px solid #efa243;outline-offset:2px}iframe{border:0;width:100%;flex:1;min-height:600px}iframe[hidden]{display:none}a{color:#087b70;font-size:12px}</style></head><body><header><strong>AIR / SCRIPT</strong><nav role="tablist" aria-label="Studio mode"><button id="patternTab" role="tab" aria-controls="patternFrame" aria-selected="true">01 · Pattern & assembly</button><button id="structureTab" role="tab" aria-controls="structureFrame" aria-selected="false" tabindex="-1">02 · Structural study</button></nav><a id="standalone" href="./AAG_Textile_Studio_2026.html" target="_blank" rel="noopener">Open selected tool in a new tab ↗</a></header><iframe id="patternFrame" role="tabpanel" aria-labelledby="patternTab" title="Original Panel and Assembly Studio" src="about:blank" allow="fullscreen" allowfullscreen></iframe><iframe id="structureFrame" role="tabpanel" aria-labelledby="structureTab" title="Membrane analysis on the current model" hidden allow="fullscreen" allowfullscreen></iframe><script>
const tabs=[document.getElementById('patternTab'),document.getElementById('structureTab')],frames=[document.getElementById('patternFrame'),document.getElementById('structureFrame')];function select(i){tabs.forEach((t,j)=>{t.setAttribute('aria-selected',String(j===i));t.tabIndex=j===i?0:-1;frames[j].hidden=j!==i});if(i===1&&!frames[1].getAttribute('src'))frames[1].src='./model-analysis.html';document.getElementById('standalone').href=i===1?'./model-analysis.html':'./AAG_Textile_Studio_2026.html';}tabs.forEach((t,i)=>{t.onclick=()=>select(i);t.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const j=e.key==='Home'?0:e.key==='End'?1:1-i;select(j);tabs[j].focus()}}});
let patternReady=false,analysisReady=false,pendingRequest=0;
function transferModel(){if(!analysisReady)return;if(patternReady)frames[0].contentWindow.postMessage({type:'request-pattern-mesh',requestId:++pendingRequest},location.origin);}
window.addEventListener('message',event=>{
 if(event.origin!==location.origin)return;
 if(event.source===frames[0].contentWindow){
  if(event.data?.type==='pattern-mesh-ready'){patternReady=true;transferModel();}
  else if(event.data?.type==='pattern-mesh'&&event.data.requestId===pendingRequest&&analysisReady)frames[1].contentWindow.postMessage({type:'analysis-mesh',mesh:event.data.mesh},location.origin);
  else if(event.data?.type==='pattern-mesh-error'&&analysisReady)frames[1].contentWindow.postMessage({type:'analysis-mesh-error',error:event.data.error},location.origin);
 }else if(event.source===frames[1].contentWindow){
  if(event.data?.type==='model-analysis-ready'){analysisReady=true;transferModel();}
  else if(event.data?.type==='request-current-pattern')transferModel();
 }
});
const originalSelect=select;select=function(i){originalSelect(i);if(i===1)transferModel();};
(async()=>{try{const response=await fetch('./AAG_Textile_Studio_2026.html');if(!response.ok)throw Error('Cannot load the pattern editor.');let source=await response.text();source=source.replace('</html>','<script src="./model-bridge.js"><\/script></html>');frames[0].srcdoc=source;}catch(error){frames[0].src='./AAG_Textile_Studio_2026.html';console.error(error)}})();

if(location.hash==='#structure')select(1);
</script></body></html>
